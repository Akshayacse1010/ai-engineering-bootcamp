[project]
name = "ai-engineering-bootcamp-prerequisites"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "akshaya.sivakumar", email = "akshaya.sivakumar@zohocorp.com" }
]
requires-python = ">=3.15"
dependencies = [
    "google-genai>=2.34.0",
    "groq>=1.7.0",
    "ipykernel>=7.4.0",
    "openai>=3.42.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "python-env>=1.0.0",
    "streamlit>=1.66.1",
]

[project.scripts]
ai-engineering-bootcamp-prerequisites = "ai_engineering_bootcamp_prerequisites:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
